version: '3.8'

services:
  # --- Service 1: FastAPI Backend Inference Processor ---
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr_attrition_api
    command: uvicorn app.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=.
    restart: always

  # --- Service 2: Streamlit User Frontend Dashboard ---
  frontend-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr_attrition_ui
    # FIXED: Direct Streamlit to run the script from its explicit subfolder tree path
    command: streamlit run app/ui/ui.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      # FIXED: Map variable exactly matching your ui.py getenv lookup name
      - BACKEND_URL=http://backend-api:8000/predict
      - PYTHONPATH=/app
    depends_on:
      - backend-api
    restart: always

